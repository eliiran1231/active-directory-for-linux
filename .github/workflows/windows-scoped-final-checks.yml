name: Scoped Windows pooling ordinary final checks
on:
  push:
    branches: [diagnostic/windows-authenticated-20261024-once]
    paths: [.github/workflows/windows-scoped-final-checks.yml]
permissions:
  contents: read
jobs:
  offline:
    if: github.run_attempt == 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ADFL_OFFLINE_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build AdForLinux.sln --configuration Release
      - run: dotnet build tests/acl-windows-oracle/AclWindowsOracle.csproj --configuration Release --framework ${{ matrix.framework }}
      - run: python tests/test_offline_runner.py
      - if: runner.os == 'Windows'
        name: Pure referral-stage regression and helper syntax checks (no trust changes)
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Test-ReferralStages.ps1
      - run: python tests/run-offline-tests.py functional --framework ${{ matrix.framework }} --results-directory artifacts/functional
      - if: runner.os == 'Windows'
        run: python tests/run-offline-tests.py surface --framework ${{ matrix.framework }} --results-directory artifacts/surface
      - if: runner.os == 'Windows'
        run: python tests/run-offline-tests.py companion --framework ${{ matrix.framework }} --results-directory artifacts/companion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-${{ matrix.os }}-${{ matrix.framework }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  samba:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start disposable Samba fixture
        run: |
          docker run -d --name smblds -p 389:389 -p 636:636 smblds/smblds:latest
          sleep 30
      - name: Linux functional checks on both runtimes
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove disposable fixture
        if: always()
        run: |
          docker compose down
          docker rm -f smblds
