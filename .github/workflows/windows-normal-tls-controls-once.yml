name: Windows normal TLS validation controls
on:
  push:
    tags: [diagnostic/windows-normal-tls-controls-20261022-once]
permissions:
  contents: read
jobs:
  controls:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build before measuring
        run: dotnet build tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj --configuration Release
      - name: Pinned and normal direct controls; existing Schannel status
        shell: pwsh
        run: |
          $since = [DateTime]::UtcNow.ToString('o')
          dotnet test tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj --no-build --no-restore --configuration Release --framework ${{ matrix.framework }} --filter FullyQualifiedName~AdForLinux.FunctionalTests.WindowsBasicReferralTests.Direct_target_tls_ --blame-hang-timeout 2m --blame-hang-dump-type none --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=direct.trx' --results-directory artifacts
          $testExit = $LASTEXITCODE
          ./tests/windows-referral-diagnostic/Read-Schannel.ps1 -Since $since
          exit $testExit
      - name: Unchanged referral baseline; existing Schannel status
        continue-on-error: true
        shell: pwsh
        run: |
          $since = [DateTime]::UtcNow.ToString('o')
          dotnet test tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj --no-build --no-restore --configuration Release --framework ${{ matrix.framework }} --filter FullyQualifiedName~AdForLinux.FunctionalTests.WindowsBasicReferralTests.Native_basic_referrals_preserve_explicit_identity_across_primary_reuse_and_impersonation --blame-hang-timeout 2m --blame-hang-dump-type none --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=referral.trx' --results-directory artifacts
          $testExit = $LASTEXITCODE
          ./tests/windows-referral-diagnostic/Read-Schannel.ps1 -Since $since
          exit $testExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-normal-tls-${{ matrix.framework }}
          path: artifacts/*.trx
