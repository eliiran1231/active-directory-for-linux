name: One-off read-only fixed DWORD token query comparison
on:
  push:
    branches: [diagnostic/windows-authenticated-20261024-once]
    paths: [.github/workflows/windows-context-query-once.yml]
permissions:
  contents: read
jobs:
  query:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_DbgEnableMiniDump: '0'
      COMPlus_DbgEnableMiniDump: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build read-only probe
        run: dotnet build tests/windows-referral-diagnostic/worker/AuthenticatedWorker.csproj --configuration Release
      - name: Compare strict length and fixed DWORD reads without security setup
        shell: pwsh
        timeout-minutes: 2
        run: |
          $failed = $false
          foreach ($framework in @('net8.0', 'net10.0')) {
            Write-Host "TOKEN QUERY $framework"
            dotnet "tests/windows-referral-diagnostic/worker/bin/Release/$framework/AuthenticatedWorker.dll" --context-query-probe
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
