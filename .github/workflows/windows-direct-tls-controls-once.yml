name: Windows direct target TLS controls
on:
  push:
    tags: [diagnostic/windows-direct-tls-controls-20261022-once]
permissions:
  contents: read
jobs:
  direct-controls:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Direct TLS controls only; no certificate imports
        run: >-
          dotnet test tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj
          --configuration Release --framework ${{ matrix.framework }}
          --filter FullyQualifiedName~AdForLinux.FunctionalTests.WindowsBasicReferralTests.Direct_target_tls_
          --blame-hang-timeout 2m --blame-hang-dump-type none
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=direct-controls.trx" --results-directory artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-direct-tls-${{ matrix.framework }}
          path: artifacts/*.trx
