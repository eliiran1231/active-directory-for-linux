name: Differential (real AD)
run-name: Differential - ${{ inputs.reason || github.event_name }}

permissions:
  contents: read

# Compares our clone against the real Microsoft library on a real AD server.
# Requires a self-hosted Windows runner that already trusts your lab server's
# certificate and can reach it on the network — see setup notes at the bottom
# of this file. Never runs on GitHub-hosted infrastructure, and never runs
# automatically on pull requests from forks (no external PR can reach your
# lab server or exfiltrate the secrets below).
on:
  schedule:
    # Nightly at 02:00 UTC. Adjust to taste — this suite is slow by design.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why you're running this manually (shows up in the log)"
        required: false
        default: "manual run"
      pr_number:
        description: "Optional PR number for the run name; dispatch from that trusted PR branch separately"
        required: false
        default: ""

jobs:
  differential-tests:
    # Must match the label(s) you gave the runner when you registered it.
    runs-on: [self-hosted, windows, ad-runner]
    timeout-minutes: 180

    # Belt-and-suspenders: even if this workflow were somehow triggered from a
    # fork's PR, forked workflows never receive repository secrets, so
    # AD_BIND_PW simply comes through empty and the job fails closed.
    environment: ad-lab

    steps:
      - uses: actions/checkout@v4

      - name: Create per-run test OU
        id: ou
        shell: powershell
        env:
          AD_BIND_DN: ${{ secrets.AD_LAB_BIND_DN }}
          AD_BIND_PW: ${{ secrets.AD_LAB_ADMIN_PASSWORD }}
          # Fixed root that must already exist on the lab server. Each run gets
          # a unique child OU below it.
          AD_CI_ROOT_DN: ${{ secrets.AD_LAB_CI_ROOT_DN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in "AD_BIND_DN", "AD_BIND_PW", "AD_CI_ROOT_DN") {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub secret for $name is not configured."
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER) -and $env:PR_NUMBER -notmatch '^\d+$') {
            throw "pr_number must contain digits only."
          }

          $runSuffix = "run$env:GITHUB_RUN_ID-attempt$env:GITHUB_RUN_ATTEMPT"
          $ouName = if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            "pr-$env:PR_NUMBER-$runSuffix"
          } else {
            "scheduled-$runSuffix"
          }

          Import-Module ActiveDirectory
          $securePassword = ConvertTo-SecureString $env:AD_BIND_PW -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:AD_BIND_DN, $securePassword)
          New-ADOrganizationalUnit `
            -Name $ouName `
            -Path $env:AD_CI_ROOT_DN `
            -Server "localhost" `
            -Credential $credential `
            -ProtectedFromAccidentalDeletion $false

          $ouDn = "OU=$ouName,$env:AD_CI_ROOT_DN"
          Write-Host "Created test OU: $ouDn"
          # Downstream steps (and the cleanup step) both read this via env.
          "AD_BASE_DN=$ouDn" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ou_dn=$ouDn" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        id: restore
        run: dotnet restore AdForLinux.sln

      - name: Run differential tests (net10.0-windows)
        env:
          AD_HOST: ${{ secrets.AD_LAB_HOST }}
          AD_PORT: "636"
          AD_USE_TLS: "true"
          AD_BIND_DN: ${{ secrets.AD_LAB_BIND_DN }}
          AD_BIND_PW: ${{ secrets.AD_LAB_ADMIN_PASSWORD }}
        run: dotnet test tests/AdForLinux.DifferentialTests -f net10.0-windows --no-restore --logger "trx;LogFileName=differential-net10.trx"

      - name: Run differential tests (net8.0-windows)
        if: ${{ always() && steps.ou.outcome == 'success' && steps.restore.outcome == 'success' }}
        env:
          AD_HOST: ${{ secrets.AD_LAB_HOST }}
          AD_PORT: "636"
          AD_USE_TLS: "true"
          AD_BIND_DN: ${{ secrets.AD_LAB_BIND_DN }}
          AD_BIND_PW: ${{ secrets.AD_LAB_ADMIN_PASSWORD }}
        run: dotnet test tests/AdForLinux.DifferentialTests -f net8.0-windows --no-restore --logger "trx;LogFileName=differential-net8.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-test-results
          path: "**/differential-net*.trx"

      - name: Delete per-run test OU
        # Always clean up, even if tests failed, so a bad run doesn't leave
        # orphaned OUs piling up on the lab server.
        if: ${{ always() && steps.ou.outputs.ou_dn != '' }}
        shell: powershell
        env:
          AD_BIND_DN: ${{ secrets.AD_LAB_BIND_DN }}
          AD_BIND_PW: ${{ secrets.AD_LAB_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ActiveDirectory
          $securePassword = ConvertTo-SecureString $env:AD_BIND_PW -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:AD_BIND_DN, $securePassword)
          Remove-ADOrganizationalUnit `
            -Identity "${{ steps.ou.outputs.ou_dn }}" `
            -Server "localhost" `
            -Credential $credential `
            -Recursive `
            -Confirm:$false

# --- One-time self-hosted runner setup (do this once on your Windows box) ---
#
# 1. Repo → Settings → Actions → Runners → New self-hosted runner → Windows.
#    Follow the download/config.cmd steps GitHub shows you, and when it asks
#    for labels, add: ad-runner
#    (You'll end up with the default "self-hosted" + "windows" labels plus
#    this one — matching the runs-on list above.)
#
# 2. Install it as a Windows service so it's always listening:
#      .\svc install
#      .\svc start
#
# 3. Trust your lab server's self-signed certificate on that machine, once:
#      certutil -addstore -f "Root" path\to\your-lab-ad-cert.cer
#    (This is a one-time machine-level trust, not something CI repeats per run.)
#
# 4. Add repository secrets (Settings → Secrets and variables → Actions):
#      AD_LAB_HOST            e.g. dc01.lab.local
#      AD_LAB_BIND_DN          e.g. administrator@lab.local
#      AD_LAB_ADMIN_PASSWORD
#      AD_LAB_CI_ROOT_DN       e.g. OU=CI,DC=lab,DC=local
#
# 5. Create that CI root OU on the lab server once, manually (it just needs
#    to exist as a parent — the workflow creates/deletes a child OU under it
#    per run, so tests from different PRs/runs never touch the same objects):
#      New-ADOrganizationalUnit -Name "CI" -Path "DC=lab,DC=local"
#    The bind account in AD_LAB_BIND_DN needs permission to create/delete the
#    per-run OU and inherited rights inside it for the users, groups, computers,
#    passwords, and security descriptors exercised by the differential suite.
#    Delegate those rights only on this CI root. The workflow passes this
#    account explicitly to the AD PowerShell cmdlets, so the runner service
#    identity needs no AD write permissions.
#
# 6. (Recommended) Create an "ad-lab" GitHub Environment and require manual
#    approval for it, or at minimum restrict which branches can deploy to it.
#    That way even a compromised PAT or accidental workflow edit can't reach
#    your lab server without a human clicking approve.
#
# 7. The runner needs the ActiveDirectory PowerShell module (RSAT-AD-PowerShell
#    feature on Windows) so it can create/delete the per-run OU:
#      Install-WindowsFeature RSAT-AD-PowerShell   # Windows Server
#      # or, on Windows 10/11: Add-WindowsCapability -Online -Name Rsat.ActiveDirectory...
#    OU management targets the runner's local AD Web Services endpoint with
#    -Server "localhost". AD_LAB_HOST remains the LDAP/LDAPS endpoint used by
#    the differential test processes.
