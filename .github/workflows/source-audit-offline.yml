name: Source audit offline
on:
  pull_request:
    branches: [dev]
  push:
    branches: [fix/audit-property-replacement-date-filters, audit/security-quality, dev]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ADFL_OFFLINE_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build AdForLinux.sln --configuration Release
      - run: dotnet build tests/acl-windows-oracle/AclWindowsOracle.csproj --configuration Release --framework ${{ matrix.framework }}
      - run: python tests/test_offline_runner.py
      - run: python tests/run-offline-tests.py functional --framework ${{ matrix.framework }} --results-directory artifacts/functional
      - if: runner.os == 'Windows'
        run: python tests/run-offline-tests.py surface --framework ${{ matrix.framework }} --results-directory artifacts/surface
      - if: runner.os == 'Windows'
        run: python tests/run-offline-tests.py companion --framework ${{ matrix.framework }} --results-directory artifacts/companion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-${{ matrix.os }}-${{ matrix.framework }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
