name: One-off authenticated Windows referral diagnostic
on:
  push:
    branches: [diagnostic/windows-authenticated-20261024-once]
    paths: [.github/workflows/windows-authenticated-once.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ADFL_DIAGNOSTIC_ID: bbef93862d7345c1bd998bd904763eea
      ADFL_E2E_BATCH: 2600bca0dfc2410e8165a4fe0ba800a6
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_DbgEnableMiniDump: '0'
      COMPlus_DbgEnableMiniDump: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pure preflight before any account or trust operation
        shell: pwsh
        run: |
          ./tests/windows-referral-diagnostic/Test-AuthenticatedInvocationScopes.ps1
          ./tests/windows-referral-diagnostic/Test-AuthenticatedFakeAdapters.ps1
      - name: Build both runtimes before security setup
        run: dotnet build tests/windows-referral-diagnostic/worker/AuthenticatedWorker.csproj --configuration Release
      - name: Command metadata and in-memory ephemeral material checks
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Test-SetupPrerequisites.ps1
      - name: Complete setup with fake identity and trust before real security actions
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Test-AuthenticatedEndToEnd.ps1 -BatchId $env:ADFL_E2E_BATCH
      - name: Independent dummy setup cleanup
        if: always()
        timeout-minutes: 4
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Test-AuthenticatedEndToEnd.ps1 -CleanupOnly -BatchId $env:ADFL_E2E_BATCH
      - name: Single bounded authenticated diagnostic
        id: diagnostic
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Authenticated-Fixture.ps1 -Mode Supervisor -RunId $env:ADFL_DIAGNOSTIC_ID
      - name: Independent exact ownership cleanup and absence verification
        id: cleanup
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          . ./tests/windows-referral-diagnostic/Authenticated-Integration.ps1
          $root = Get-DiagnosticRoot $env:LOCALAPPDATA $env:ADFL_DIAGNOSTIC_ID
          if (Test-Path -LiteralPath (Join-Path $root 'owner.json')) {
            ./tests/windows-referral-diagnostic/Authenticated-Fixture.ps1 -Mode Cleanup -RunId $env:ADFL_DIAGNOSTIC_ID
            exit $LASTEXITCODE
          }
          if ((Test-Path -LiteralPath (Join-Path $root 'accounts.json')) -or
              (Test-Path -LiteralPath (Join-Path $root 'certificate.json')) -or
              (Test-Path -LiteralPath (Join-Path $root 'provider-key.json')) -or
              (Test-Path -LiteralPath (Join-Path $root 'loopback.cer')) -or
              (Test-Path -LiteralPath (Join-Path $root 'loopback.pfx'))) {
            throw 'Unexpected ownership state; cannot claim cleanup.'
          }
          Write-Host 'No security setup reached: owner and object manifests and PFX absent.'
      - name: Emit only schema-validated native observations
        if: always()
        shell: pwsh
        run: |
          . ./tests/windows-referral-diagnostic/Authenticated-Integration.ps1
          $root = Get-DiagnosticRoot $env:LOCALAPPDATA $env:ADFL_DIAGNOSTIC_ID
          foreach ($framework in @('net8.0', 'net10.0')) {
            $path = Join-Path $root "$framework-results.json"
            if (Test-Path -LiteralPath $path) {
              if ((Get-Item -LiteralPath $path).Length -gt 65536) { throw 'Oversized result withheld.' }
              $result = ConvertTo-DiagnosticResult (Get-Content -Raw -LiteralPath $path)
              Write-Host "$framework observations:"
              $result | ConvertTo-Json -Depth 8 -Compress | Write-Host
            } else { Write-Host "$framework has no completed native result." }
          }
      - name: Remove only owned temporary files after independent object cleanup
        if: always() && steps.cleanup.outcome == 'success'
        shell: pwsh
        run: |
          . ./tests/windows-referral-diagnostic/Authenticated-Integration.ps1
          $root = Get-DiagnosticRoot $env:LOCALAPPDATA $env:ADFL_DIAGNOSTIC_ID
          if (!(Test-Path -LiteralPath $root)) { Write-Host 'Temporary directory absent; no removal required.'; exit 0 }
          Assert-DiagnosticNoReparsePath $root
          Assert-DiagnosticDirectoryPrivate $root
          $owner = Get-Content -Raw -LiteralPath (Join-Path $root 'owner.json') | ConvertFrom-Json
          if ($owner.Version -ne 1 -or $owner.RunId -cne $env:ADFL_DIAGNOSTIC_ID -or $owner.TestOnly -isnot [bool] -or $owner.TestOnly) {
            throw 'Temporary directory ownership not verified.'
          }
          $allowed = @('owner.json', 'accounts.json', 'certificate.json', 'provider-key.json', 'loopback.cer', 'loopback.pfx',
            'stage.txt', 'stages.txt', 'ready.json', 'chain.json', 'coordinator-failure.json',
            'net8.0-results.json', 'net10.0-results.json', 'net8.0-failure.json', 'net10.0-failure.json')
          $allowed += @($allowed | ForEach-Object { "$_.new" })
          $files = @(Get-ChildItem -Force -LiteralPath $root)
          foreach ($file in $files) {
            if ($file.Name -notin $allowed -or $file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'Unexpected object; temporary cleanup incomplete.'
            }
          }
          foreach ($file in $files) { Remove-Item -LiteralPath $file.FullName -Force }
          [IO.Directory]::Delete($root, $false)
          if (Test-Path -LiteralPath $root) { throw 'Owned temporary directory remains.' }
          Write-Host 'CLEANUP independently verified all owned temporary files and directory absent.'
