name: One-off Windows referral trust stage diagnostic
on:
  push:
    tags: [diagnostic/windows-basic-trust-stages-20261021-once]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Parse helper before setup
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tests/windows-referral-diagnostic/Trust-Fixture.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Build both runtimes before certificate setup
        run: dotnet build tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj --configuration Release
      - name: Bounded setup and sequential native tests
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Trust-Fixture.ps1
      - name: Independent exact-thumbprint cleanup verification
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Trust-Fixture.ps1 -Cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-referral-trust-stages
          path: artifacts/*.trx
