name: One-off Windows referral trust diagnostic
# Explicit opt-in tag for the single approved job. Never runs on PRs or branches.
on:
  push:
    tags: [diagnostic/windows-basic-trust-20261021-once]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: One certificate, both runtimes, guaranteed local cleanup
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Trust-Fixture.ps1
      - name: Verify exact certificate removal again
        if: always()
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Trust-Fixture.ps1 -Cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-referral-trust-diagnostic
          path: artifacts/*.trx
