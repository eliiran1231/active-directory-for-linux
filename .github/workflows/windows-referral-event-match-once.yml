name: Windows referral certificate event attribution
on:
  push:
    tags: [diagnostic/windows-referral-event-match-20261022-once]
permissions:
  contents: read
jobs:
  attribution:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Parser self-test with synthetic in-memory events
        shell: pwsh
        run: ./tests/windows-referral-diagnostic/Test-SchannelMatcher.ps1
      - name: Isolated native referral baseline and in-memory event attribution
        env:
          ADFL_REFERRAL_MATCH_EVENT: '1'
        run: >-
          dotnet test tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj
          --configuration Release --framework ${{ matrix.framework }}
          --filter FullyQualifiedName~AdForLinux.FunctionalTests.WindowsBasicReferralTests.Native_basic_referrals_preserve_explicit_identity_across_primary_reuse_and_impersonation
          --blame-hang-timeout 2m --blame-hang-dump-type none
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=referral-attribution.trx" --results-directory artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-referral-attribution-${{ matrix.framework }}
          path: artifacts/*.trx
