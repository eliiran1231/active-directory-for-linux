name: One-off Windows authenticated helper PURE preflight
on:
  push:
    branches: [diagnostic/windows-authenticated-20261024-once]
    paths: [.github/workflows/windows-authenticated-preflight-once.yml]
permissions:
  contents: read
jobs:
  pure-preflight:
    if: github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_DbgEnableMiniDump: '0'
      COMPlus_DbgEnableMiniDump: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pure helper tests in direct and actual workflow invocation scopes
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/windows-referral-diagnostic/Test-AuthenticatedInvocationScopes.ps1
      - name: Compile both workers without running native tests
        run: dotnet build tests/windows-referral-diagnostic/worker/AuthenticatedWorker.csproj --configuration Release
      - name: Pure worker checks only on both runtimes
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net10.0')) {
            dotnet "tests/windows-referral-diagnostic/worker/bin/Release/$framework/AuthenticatedWorker.dll" --self-test
            if ($LASTEXITCODE -ne 0) { throw "Pure worker self-test failed for $framework." }
          }
