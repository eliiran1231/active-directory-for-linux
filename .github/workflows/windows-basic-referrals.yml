name: Windows native Basic referrals
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  native-referrals:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Native integration, intentionally separate from guarded offline tests.
      # Exact filter: only loopback fixtures, no AD_* settings or directory access.
      - name: Native WinLDAP referral tests
        shell: pwsh
        run: |
          $since = [DateTime]::UtcNow.ToString('o')
          dotnet test tests/AdForLinux.FunctionalTests/AdForLinux.FunctionalTests.csproj --configuration Release --framework ${{ matrix.framework }} --filter FullyQualifiedName~AdForLinux.FunctionalTests.WindowsBasicReferralTests. --blame-hang-timeout 2m --blame-hang-dump-type none --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=native-referrals.trx' --results-directory artifacts
          $testExit = $LASTEXITCODE
          ./tests/windows-referral-diagnostic/Read-Schannel.ps1 -Since $since
          exit $testExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-referrals-${{ matrix.framework }}
          path: artifacts/*.trx
